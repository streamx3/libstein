name: Fixtures (macOS)

# Builds, on dispatch or when its inputs change, the HFS+ family and APFS
# reader fixtures and the DMG container fixtures with hdiutil, which only
# macOS has, and commits them under tests/fixtures/{hfsfs,apfs,dmg} on the
# same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/fixtures/make_hfsplus_fixtures_macos.sh
      - tools/fixtures/make_dmg_fixtures_macos.sh
      - tools/fixtures/make_apfs_fixtures_macos.sh
      - tools/fixtures/oracle.py
      - .github/workflows/fixtures-macos.yml

permissions:
  contents: write

jobs:
  hfsplus:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Each generator runs only when its fixtures are absent: hdiutil output carries fresh
      # UUIDs and timestamps, so re-running would churn megabytes in git for no gain.
      # Delete a fixture directory on the branch to have it rebuilt.
      - name: Build HFS+ fixtures
        if: ${{ hashFiles('tests/fixtures/hfsfs/hfsplus.sparse') == '' }}
        run: tools/fixtures/make_hfsplus_fixtures_macos.sh tests/fixtures/hfsfs
      - name: Build APFS fixtures (the script keeps variants that already exist)
        run: tools/fixtures/make_apfs_fixtures_macos.sh tests/fixtures/apfs
      - name: Build DMG fixtures (the script keeps variants that already exist)
        run: tools/fixtures/make_dmg_fixtures_macos.sh tests/fixtures/dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hfsfs-fixtures
          path: |
            tests/fixtures/hfsfs
            tests/fixtures/apfs
            tests/fixtures/dmg
          if-no-files-found: ignore
      - name: Commit fixtures to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/hfsfs tests/fixtures/apfs tests/fixtures/dmg
          if git diff --cached --quiet; then echo "fixtures unchanged"; exit 0; fi
          git commit -m "fixtures: HFS+/APFS/DMG fixtures generated on macOS"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
