# ext2/ext3/ext4 superblock — e2fsprogs lib/ext2fs/ext2_fs.h (struct ext2_super_block).
# Located at byte 1024 of the filesystem, 1024 bytes long, little-endian.

[ext_superblock]
doc = "ext2/3/4 superblock at offset 1024"
size = 1024
endian = "le"
fields = [
  { name = "inodes_count",        offset = 0x00, type = "u32", nonzero = true, doc = "Total inode count" },
  { name = "blocks_count_lo",     offset = 0x04, type = "u32", doc = "Total block count, low 32 bits" },
  { name = "r_blocks_count_lo",   offset = 0x08, type = "u32", doc = "Reserved blocks, low 32 bits" },
  { name = "free_blocks_count_lo",offset = 0x0C, type = "u32", doc = "Free blocks, low 32 bits" },
  { name = "free_inodes_count",   offset = 0x10, type = "u32", doc = "Free inodes" },
  { name = "first_data_block",    offset = 0x14, type = "u32", doc = "0 for 4 KiB blocks, 1 for 1 KiB blocks" },
  { name = "log_block_size",      offset = 0x18, type = "u32", max = 6, doc = "Block size = 1024 << log_block_size" },
  { name = "log_cluster_size",    offset = 0x1C, type = "u32", doc = "Cluster size (bigalloc)" },
  { name = "blocks_per_group",    offset = 0x20, type = "u32", nonzero = true },
  { name = "clusters_per_group",  offset = 0x24, type = "u32" },
  { name = "inodes_per_group",    offset = 0x28, type = "u32", nonzero = true },
  { name = "mtime",               offset = 0x2C, type = "u32", doc = "Last mount time (Unix seconds)" },
  { name = "wtime",               offset = 0x30, type = "u32", doc = "Last write time" },
  { name = "mnt_count",           offset = 0x34, type = "u16", doc = "Mounts since last fsck" },
  { name = "max_mnt_count",       offset = 0x36, type = "u16" },
  { name = "magic",               offset = 0x38, type = "u16", expect = 0xEF53, doc = "0xEF53" },
  { name = "state",               offset = 0x3A, type = "bits16", bits = { "0" = "cleanly_unmounted", "1" = "errors_detected", "2" = "orphans_being_recovered" }, doc = "EXT2_VALID_FS / EXT2_ERROR_FS" },
  { name = "errors",              offset = 0x3C, type = "u16", enum = { "1" = "continue", "2" = "remount-ro", "3" = "panic" } },
  { name = "minor_rev_level",     offset = 0x3E, type = "u16" },
  { name = "lastcheck",           offset = 0x40, type = "u32", doc = "Time of last fsck" },
  { name = "checkinterval",       offset = 0x44, type = "u32" },
  { name = "creator_os",          offset = 0x48, type = "u32", enum = { "0" = "Linux", "1" = "Hurd", "2" = "Masix", "3" = "FreeBSD", "4" = "Lites" } },
  { name = "rev_level",           offset = 0x4C, type = "u32", enum = { "0" = "original (GOOD_OLD_REV)", "1" = "dynamic (v2)" } },
  { name = "def_resuid",          offset = 0x50, type = "u16" },
  { name = "def_resgid",          offset = 0x52, type = "u16" },
  { name = "first_ino",           offset = 0x54, type = "u32", doc = "First non-reserved inode (11)" },
  { name = "inode_size",          offset = 0x58, type = "u16", doc = "128 or 256" },
  { name = "block_group_nr",      offset = 0x5A, type = "u16", doc = "Block group of this superblock copy" },
  { name = "feature_compat",      offset = 0x5C, type = "bits32", bits = { "0" = "dir_prealloc", "1" = "imagic_inodes", "2" = "has_journal", "3" = "ext_attr", "4" = "resize_inode", "5" = "dir_index", "6" = "lazy_bg", "7" = "exclude_inode", "8" = "exclude_bitmap", "9" = "sparse_super2", "10" = "fast_commit", "11" = "stable_inodes", "12" = "orphan_file" } },
  { name = "feature_incompat",    offset = 0x60, type = "bits32", bits = { "0" = "compression", "1" = "filetype", "2" = "recover", "3" = "journal_dev", "4" = "meta_bg", "6" = "extents", "7" = "64bit", "8" = "mmp", "9" = "flex_bg", "10" = "ea_inode", "12" = "dirdata", "13" = "csum_seed", "14" = "largedir", "15" = "inline_data", "16" = "encrypt", "17" = "casefold" } },
  { name = "feature_ro_compat",   offset = 0x64, type = "bits32", bits = { "0" = "sparse_super", "1" = "large_file", "2" = "btree_dir", "3" = "huge_file", "4" = "gdt_csum", "5" = "dir_nlink", "6" = "extra_isize", "7" = "has_snapshot", "8" = "quota", "9" = "bigalloc", "10" = "metadata_csum", "11" = "replica", "12" = "readonly", "13" = "project", "15" = "verity", "16" = "orphan_present" } },
  { name = "uuid",                offset = 0x68, type = "uuid", doc = "Filesystem UUID (RFC byte order)" },
  { name = "volume_name",         offset = 0x78, type = "ascii", size = 16, doc = "Label, NUL padded (UTF-8 in practice)" },
  { name = "last_mounted",        offset = 0x88, type = "ascii", size = 64, doc = "Directory where last mounted" },
  { name = "algorithm_usage_bitmap", offset = 0xC8, type = "u32" },
  { name = "prealloc_blocks",     offset = 0xCC, type = "u8" },
  { name = "prealloc_dir_blocks", offset = 0xCD, type = "u8" },
  { name = "reserved_gdt_blocks", offset = 0xCE, type = "u16" },
  { name = "journal_uuid",        offset = 0xD0, type = "uuid", doc = "UUID of the journal superblock (external journals)" },
  { name = "journal_inum",        offset = 0xE0, type = "u32", doc = "Inode number of the journal file (8)" },
  { name = "journal_dev",         offset = 0xE4, type = "u32" },
  { name = "last_orphan",         offset = 0xE8, type = "u32" },
  { name = "hash_seed",           offset = 0xEC, type = "bytes", size = 16 },
  { name = "def_hash_version",    offset = 0xFC, type = "u8", enum = { "0" = "legacy", "1" = "half_md4", "2" = "tea", "3" = "legacy_unsigned", "4" = "half_md4_unsigned", "5" = "tea_unsigned", "6" = "siphash" } },
  { name = "jnl_backup_type",     offset = 0xFD, type = "u8" },
  { name = "desc_size",           offset = 0xFE, type = "u16", doc = "Group descriptor size (64bit feature)" },
  { name = "default_mount_opts",  offset = 0x100, type = "u32" },
  { name = "first_meta_bg",       offset = 0x104, type = "u32" },
  { name = "mkfs_time",           offset = 0x108, type = "u32", doc = "Filesystem creation time" },
  { name = "jnl_blocks",          offset = 0x10C, type = "bytes", size = 68, doc = "Backup of the journal inode's i_block[] and i_size" },
  { name = "blocks_count_hi",     offset = 0x150, type = "u32", doc = "Total block count, high 32 bits (64bit)" },
  { name = "r_blocks_count_hi",   offset = 0x154, type = "u32" },
  { name = "free_blocks_count_hi",offset = 0x158, type = "u32" },
  { name = "min_extra_isize",     offset = 0x15C, type = "u16" },
  { name = "want_extra_isize",    offset = 0x15E, type = "u16" },
  { name = "flags",               offset = 0x160, type = "bits32", bits = { "0" = "signed_dir_hash", "1" = "unsigned_dir_hash", "2" = "test_filesys" } },
  { name = "raid_stride",         offset = 0x164, type = "u16" },
  { name = "mmp_update_interval", offset = 0x166, type = "u16" },
  { name = "mmp_block",           offset = 0x168, type = "u64" },
  { name = "raid_stripe_width",   offset = 0x170, type = "u32" },
  { name = "log_groups_per_flex", offset = 0x174, type = "u8" },
  { name = "checksum_type",       offset = 0x175, type = "u8", enum = { "0" = "none", "1" = "crc32c" } },
  { name = "encryption_level",    offset = 0x176, type = "u8" },
  { name = "reserved_pad",        offset = 0x177, type = "u8" },
  { name = "kbytes_written",      offset = 0x178, type = "u64", doc = "Lifetime KiB written" },
  { name = "snapshot_inum",       offset = 0x180, type = "u32" },
  { name = "snapshot_id",         offset = 0x184, type = "u32" },
  { name = "snapshot_r_blocks_count", offset = 0x188, type = "u64" },
  { name = "snapshot_list",       offset = 0x190, type = "u32" },
  { name = "error_count",         offset = 0x194, type = "u32", doc = "Number of errors seen" },
  { name = "first_error_time",    offset = 0x198, type = "u32" },
  { name = "first_error_ino",     offset = 0x19C, type = "u32" },
  { name = "first_error_block",   offset = 0x1A0, type = "u64" },
  { name = "first_error_func",    offset = 0x1A8, type = "ascii", size = 32 },
  { name = "first_error_line",    offset = 0x1C8, type = "u32" },
  { name = "last_error_time",     offset = 0x1CC, type = "u32" },
  { name = "last_error_ino",      offset = 0x1D0, type = "u32" },
  { name = "last_error_line",     offset = 0x1D4, type = "u32" },
  { name = "last_error_block",    offset = 0x1D8, type = "u64" },
  { name = "last_error_func",     offset = 0x1E0, type = "ascii", size = 32 },
  { name = "mount_opts",          offset = 0x200, type = "ascii", size = 64 },
  { name = "usr_quota_inum",      offset = 0x240, type = "u32" },
  { name = "grp_quota_inum",      offset = 0x244, type = "u32" },
  { name = "overhead_clusters",   offset = 0x248, type = "u32" },
  { name = "backup_bgs",          offset = 0x24C, type = "bytes", size = 8, doc = "Groups with sparse_super2 backups" },
  { name = "encrypt_algos",       offset = 0x254, type = "bytes", size = 4 },
  { name = "encrypt_pw_salt",     offset = 0x258, type = "bytes", size = 16 },
  { name = "lpf_ino",             offset = 0x268, type = "u32", doc = "lost+found inode" },
  { name = "prj_quota_inum",      offset = 0x26C, type = "u32" },
  { name = "checksum_seed",       offset = 0x270, type = "u32" },
  { name = "wtime_hi",            offset = 0x274, type = "u8" },
  { name = "mtime_hi",            offset = 0x275, type = "u8" },
  { name = "mkfs_time_hi",        offset = 0x276, type = "u8" },
  { name = "lastcheck_hi",        offset = 0x277, type = "u8" },
  { name = "first_error_time_hi", offset = 0x278, type = "u8" },
  { name = "last_error_time_hi",  offset = 0x279, type = "u8" },
  { name = "first_error_errcode", offset = 0x27A, type = "u8" },
  { name = "last_error_errcode",  offset = 0x27B, type = "u8" },
  { name = "encoding",            offset = 0x27C, type = "u16", enum = { "0" = "none", "1" = "utf8-12.1" } },
  { name = "encoding_flags",      offset = 0x27E, type = "u16" },
  { name = "orphan_file_inum",    offset = 0x280, type = "u32" },
  { name = "reserved",            offset = 0x284, type = "bytes", size = 376 },
  { name = "checksum",            offset = 0x3FC, type = "crc32", doc = "crc32c of the superblock (metadata_csum)" },
]
