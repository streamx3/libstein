# Linux md RAID superblock version 1.x (include/uapi/linux/raid/md_p.h struct mdp_superblock_1),
# little-endian. 1.2 at offset 4096, 1.1 at 0, 1.0 at 8 KiB before the end (aligned).
[md_superblock_1]
doc = "md RAID superblock v1 (256 bytes + dev_roles)"
size = 256
endian = "le"
fields = [
  { name = "magic",           offset = 0x00, type = "u32", expect = 0xA92B4EFC },
  { name = "major_version",   offset = 0x04, type = "u32", expect = 1 },
  { name = "feature_map",     offset = 0x08, type = "bits32", bits = { "0" = "bitmap_offset", "1" = "recovery_offset", "2" = "reshape_active", "3" = "bad_blocks", "4" = "replacement", "5" = "reshape_backwards", "6" = "new_offset", "7" = "recovery_bitmap", "8" = "cluster_raid", "9" = "journal", "10" = "ppl", "11" = "multiple_ppls", "12" = "raid0_layout" } },
  { name = "pad0",            offset = 0x0C, type = "u32" },
  { name = "set_uuid",        offset = 0x10, type = "uuid", doc = "Array UUID" },
  { name = "set_name",        offset = 0x20, type = "ascii", size = 32, doc = "Array name (host:name)" },
  { name = "ctime",           offset = 0x40, type = "u64", doc = "Creation time (low 40 bits seconds, high 24 bits µs)" },
  { name = "level",           offset = 0x48, type = "i32", enum = { "-4" = "multipath", "-1" = "linear", "0" = "raid0", "1" = "raid1", "4" = "raid4", "5" = "raid5", "6" = "raid6", "10" = "raid10" } },
  { name = "layout",          offset = 0x4C, type = "u32" },
  { name = "size",            offset = 0x50, type = "u64", doc = "Used size of each device, in sectors" },
  { name = "chunksize",       offset = 0x58, type = "u32", doc = "In sectors" },
  { name = "raid_disks",      offset = 0x5C, type = "u32", nonzero = true },
  { name = "bitmap_offset",   offset = 0x60, type = "u32" },
  { name = "new_level",       offset = 0x64, type = "u32" },
  { name = "reshape_position",offset = 0x68, type = "u64" },
  { name = "delta_disks",     offset = 0x70, type = "u32" },
  { name = "new_layout",      offset = 0x74, type = "u32" },
  { name = "new_chunk",       offset = 0x78, type = "u32" },
  { name = "new_offset",      offset = 0x7C, type = "u32" },
  { name = "data_offset",     offset = 0x80, type = "u64", doc = "Sector where data begins on this device" },
  { name = "data_size",       offset = 0x88, type = "u64" },
  { name = "super_offset",    offset = 0x90, type = "u64", doc = "Sector of this superblock (8 for v1.2)" },
  { name = "recovery_offset", offset = 0x98, type = "u64" },
  { name = "dev_number",      offset = 0xA0, type = "u32" },
  { name = "cnt_corrected_read", offset = 0xA4, type = "u32" },
  { name = "device_uuid",     offset = 0xA8, type = "uuid" },
  { name = "devflags",        offset = 0xB8, type = "bits8", bits = { "0" = "write_mostly", "1" = "failfast" } },
  { name = "bblog_shift",     offset = 0xB9, type = "u8" },
  { name = "bblog_size",      offset = 0xBA, type = "u16" },
  { name = "bblog_offset",    offset = 0xBC, type = "u32" },
  { name = "utime",           offset = 0xC0, type = "u64" },
  { name = "events",          offset = 0xC8, type = "u64" },
  { name = "resync_offset",   offset = 0xD0, type = "u64" },
  { name = "sb_csum",         offset = 0xD8, type = "crc32", doc = "Folded 32-bit sum, not a CRC" },
  { name = "max_dev",         offset = 0xDC, type = "u32" },
  { name = "pad3",            offset = 0xE0, type = "bytes", size = 32 },
]
