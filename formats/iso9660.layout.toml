# ISO 9660 (ECMA-119) primary volume descriptor at sector 16 (byte 32768). Numbers are
# stored both-endian; this manifest reads the little-endian half of each pair.
[iso_primary_volume_descriptor]
doc = "ISO 9660 Primary Volume Descriptor (2048 bytes at 32768); Joliet SVD follows at 34816"
size = 2048
endian = "le"
fields = [
  { name = "type",                 offset = 0x000, type = "u8", enum = { "0" = "boot record", "1" = "primary", "2" = "supplementary (Joliet)", "3" = "partition", "255" = "terminator" } },
  { name = "standard_id",          offset = 0x001, type = "ascii", size = 5, expect = "CD001" },
  { name = "version",              offset = 0x006, type = "u8", expect = 1 },
  { name = "unused1",              offset = 0x007, type = "u8" },
  { name = "system_id",            offset = 0x008, type = "ascii", size = 32, pad = " " },
  { name = "volume_id",            offset = 0x028, type = "ascii", size = 32, pad = " ", doc = "Label" },
  { name = "unused2",              offset = 0x048, type = "bytes", size = 8 },
  { name = "volume_space_size",    offset = 0x050, type = "u32", doc = "Logical blocks (LE half of the both-endian pair)" },
  { name = "escape_sequences",     offset = 0x058, type = "bytes", size = 32, doc = "Joliet: 25 2F 40|43|45" },
  { name = "volume_set_size",      offset = 0x078, type = "u16" },
  { name = "volume_sequence_number", offset = 0x07C, type = "u16" },
  { name = "logical_block_size",   offset = 0x080, type = "u16", doc = "Usually 2048" },
  { name = "path_table_size",      offset = 0x084, type = "u32" },
  { name = "type_l_path_table",    offset = 0x08C, type = "u32" },
  { name = "opt_type_l_path_table",offset = 0x090, type = "u32" },
  { name = "type_m_path_table",    offset = 0x094, type = "u32", endian = "be" },
  { name = "opt_type_m_path_table",offset = 0x098, type = "u32", endian = "be" },
  { name = "root_directory_record",offset = 0x09C, type = "bytes", size = 34 },
  { name = "volume_set_id",        offset = 0x0BE, type = "ascii", size = 128, pad = " " },
  { name = "publisher_id",         offset = 0x13E, type = "ascii", size = 128, pad = " " },
  { name = "preparer_id",          offset = 0x1BE, type = "ascii", size = 128, pad = " " },
  { name = "application_id",       offset = 0x23E, type = "ascii", size = 128, pad = " " },
  { name = "copyright_file_id",    offset = 0x2BE, type = "ascii", size = 37, pad = " " },
  { name = "abstract_file_id",     offset = 0x2E3, type = "ascii", size = 37, pad = " " },
  { name = "bibliographic_file_id",offset = 0x308, type = "ascii", size = 37, pad = " " },
  { name = "creation_date",        offset = 0x32D, type = "ascii", size = 17, doc = "YYYYMMDDHHMMSScc + tz; blkid uses it as the UUID" },
  { name = "modification_date",    offset = 0x33E, type = "ascii", size = 17 },
  { name = "expiration_date",      offset = 0x34F, type = "ascii", size = 17 },
  { name = "effective_date",       offset = 0x360, type = "ascii", size = 17 },
  { name = "file_structure_version", offset = 0x371, type = "u8" },
]
