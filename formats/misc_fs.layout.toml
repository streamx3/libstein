# Smaller superblocks: JFS, ReiserFS, NILFS2, Minix, EROFS, SquashFS, OCFS2, UDF anchor, APFS container.

[jfs_superblock]
doc = "JFS superblock at offset 32768 (secondary at 61440)"
size = 0x98
endian = "le"
fields = [
  { name = "magic",      offset = 0x00, type = "ascii", size = 4, expect = "JFS1" },
  { name = "version",    offset = 0x04, type = "u32" },
  { name = "size",       offset = 0x08, type = "u64", doc = "Aggregate size in 512-byte blocks" },
  { name = "bsize",      offset = 0x10, type = "u32", doc = "Block size" },
  { name = "l2bsize",    offset = 0x14, type = "u16" },
  { name = "l2bfactor",  offset = 0x16, type = "u16" },
  { name = "pbsize",     offset = 0x18, type = "u32", doc = "Physical block size" },
  { name = "l2pbsize",   offset = 0x1C, type = "u16" },
  { name = "pad",        offset = 0x1E, type = "u16" },
  { name = "agsize",     offset = 0x20, type = "u32" },
  { name = "flag",       offset = 0x24, type = "bits32", bits = { "4" = "jfs_os2", "5" = "jfs_aix", "6" = "jfs_linux", "11" = "commit", "12" = "groupcommit", "13" = "lazycommit", "17" = "inlinelog", "20" = "bad_sait", "21" = "sparse", "22" = "dasd_enabled", "23" = "dasd_prime" } },
  { name = "state",      offset = 0x28, type = "u32", enum = { "0" = "clean", "1" = "mounted", "2" = "dirty", "4" = "logredo", "8" = "extendfs" } },
  { name = "compress",   offset = 0x2C, type = "u32" },
  { name = "ait2",       offset = 0x30, type = "bytes", size = 8 },
  { name = "aim2",       offset = 0x38, type = "bytes", size = 8 },
  { name = "logdev",     offset = 0x40, type = "u32" },
  { name = "logserial",  offset = 0x44, type = "u32" },
  { name = "logpxd",     offset = 0x48, type = "bytes", size = 8 },
  { name = "fsckpxd",    offset = 0x50, type = "bytes", size = 8 },
  { name = "time",       offset = 0x58, type = "bytes", size = 8 },
  { name = "fsckloglen", offset = 0x60, type = "u32" },
  { name = "fscklog",    offset = 0x64, type = "u8" },
  { name = "fpack",      offset = 0x65, type = "ascii", size = 11, doc = "Legacy 11-char label" },
  { name = "xsize",      offset = 0x70, type = "u64" },
  { name = "xfsckpxd",   offset = 0x78, type = "bytes", size = 8 },
  { name = "xlogpxd",    offset = 0x80, type = "bytes", size = 8 },
  { name = "uuid",       offset = 0x88, type = "uuid" },
]
# Note: the JFS label lives at 0x98 (16 bytes) and the log UUID at 0xA8; struct extended below.
[jfs_superblock_tail]
doc = "JFS superblock, label and log UUID (offset 0x98 within the superblock)"
size = 32
endian = "le"
fields = [
  { name = "label",    offset = 0x00, type = "ascii", size = 16 },
  { name = "loguuid",  offset = 0x10, type = "uuid" },
]

[reiserfs_superblock]
doc = "ReiserFS 3.x superblock at offset 65536 (old format at 8192)"
size = 0x68
endian = "le"
fields = [
  { name = "block_count",     offset = 0x00, type = "u32", nonzero = true },
  { name = "free_blocks",     offset = 0x04, type = "u32" },
  { name = "root_block",      offset = 0x08, type = "u32" },
  { name = "journal",         offset = 0x0C, type = "bytes", size = 28, doc = "struct journal_params" },
  { name = "blocksize",       offset = 0x2C, type = "u16", nonzero = true },
  { name = "oid_maxsize",     offset = 0x2E, type = "u16" },
  { name = "oid_cursize",     offset = 0x30, type = "u16" },
  { name = "umount_state",    offset = 0x32, type = "u16", enum = { "1" = "cleanly unmounted", "2" = "not cleanly unmounted" } },
  { name = "magic",           offset = 0x34, type = "ascii", size = 10, doc = "ReIsErFs, ReIsEr2Fs, ReIsEr3Fs" },
  { name = "fs_state",        offset = 0x3E, type = "u16", enum = { "0" = "consistent", "1" = "errors" } },
  { name = "hash_function_code", offset = 0x40, type = "u32", enum = { "0" = "unset", "1" = "tea", "2" = "yura", "3" = "r5" } },
  { name = "tree_height",     offset = 0x44, type = "u16" },
  { name = "bmap_nr",         offset = 0x46, type = "u16" },
  { name = "version",         offset = 0x48, type = "u16", doc = "0 = 3.5, 2 = 3.6" },
  { name = "reserved_for_journal", offset = 0x4A, type = "u16" },
  { name = "inode_generation",offset = 0x4C, type = "u32" },
  { name = "flags",           offset = 0x50, type = "u32" },
  { name = "uuid",            offset = 0x54, type = "uuid" },
  { name = "label",           offset = 0x64, type = "ascii", size = 4, doc = "(first 4 of 16 bytes; full label at 0x64..0x74)" },
]
[reiserfs_label]
doc = "ReiserFS label (16 bytes at superblock offset 0x64)"
size = 16
endian = "le"
fields = [ { name = "label", offset = 0x0, type = "ascii", size = 16 } ]

[nilfs2_superblock]
doc = "NILFS2 superblock at offset 1024 (secondary at the end)"
size = 0xF8
endian = "le"
fields = [
  { name = "rev_level",       offset = 0x00, type = "u32" },
  { name = "minor_rev_level", offset = 0x04, type = "u16" },
  { name = "magic",           offset = 0x06, type = "u16", expect = 0x3434 },
  { name = "bytes",           offset = 0x08, type = "u16", doc = "Size of this superblock" },
  { name = "flags",           offset = 0x0A, type = "u16" },
  { name = "crc_seed",        offset = 0x0C, type = "u32" },
  { name = "sum",             offset = 0x10, type = "crc32", doc = "crc32c over `bytes` bytes with sum zeroed" },
  { name = "log_block_size",  offset = 0x14, type = "u32", doc = "Block size = 1024 << log_block_size" },
  { name = "nsegments",       offset = 0x18, type = "u64" },
  { name = "dev_size",        offset = 0x20, type = "u64", doc = "Device size in bytes" },
  { name = "first_data_block",offset = 0x28, type = "u64" },
  { name = "blocks_per_segment", offset = 0x30, type = "u32" },
  { name = "r_segments_percentage", offset = 0x34, type = "u32" },
  { name = "last_cno",        offset = 0x38, type = "u64" },
  { name = "last_pseg",       offset = 0x40, type = "u64" },
  { name = "last_seq",        offset = 0x48, type = "u64" },
  { name = "free_blocks_count", offset = 0x50, type = "u64" },
  { name = "ctime",           offset = 0x58, type = "u64" },
  { name = "mtime",           offset = 0x60, type = "u64" },
  { name = "wtime",           offset = 0x68, type = "u64" },
  { name = "mnt_count",       offset = 0x70, type = "u16" },
  { name = "max_mnt_count",   offset = 0x72, type = "u16" },
  { name = "state",           offset = 0x74, type = "bits16", bits = { "0" = "valid (clean)", "1" = "error", "2" = "resize" } },
  { name = "errors",          offset = 0x76, type = "u16" },
  { name = "lastcheck",       offset = 0x78, type = "u64" },
  { name = "checkinterval",   offset = 0x80, type = "u32" },
  { name = "creator_os",      offset = 0x84, type = "u32" },
  { name = "def_resuid",      offset = 0x88, type = "u16" },
  { name = "def_resgid",      offset = 0x8A, type = "u16" },
  { name = "first_ino",       offset = 0x8C, type = "u32" },
  { name = "inode_size",      offset = 0x90, type = "u16" },
  { name = "dat_entry_size",  offset = 0x92, type = "u16" },
  { name = "checkpoint_size", offset = 0x94, type = "u16" },
  { name = "segment_usage_size", offset = 0x96, type = "u16" },
  { name = "uuid",            offset = 0x98, type = "uuid" },
  { name = "volume_name",     offset = 0xA8, type = "ascii", size = 80, doc = "(80 of 80 bytes; struct continues)" },
]

[minix_superblock]
doc = "Minix v1/v2 superblock at offset 1024"
size = 24
endian = "le"
fields = [
  { name = "ninodes",       offset = 0x00, type = "u16" },
  { name = "nzones",        offset = 0x02, type = "u16" },
  { name = "imap_blocks",   offset = 0x04, type = "u16" },
  { name = "zmap_blocks",   offset = 0x06, type = "u16" },
  { name = "firstdatazone", offset = 0x08, type = "u16" },
  { name = "log_zone_size", offset = 0x0A, type = "u16" },
  { name = "max_size",      offset = 0x0C, type = "u32" },
  { name = "magic",         offset = 0x10, type = "u16", enum = { "0x137F" = "minix v1, 14-char names", "0x138F" = "minix v1, 30-char names", "0x2468" = "minix v2, 14-char names", "0x2478" = "minix v2, 30-char names" } },
  { name = "state",         offset = 0x12, type = "u16", enum = { "1" = "valid", "2" = "error" } },
  { name = "zones",         offset = 0x14, type = "u32" },
]
[minix3_superblock]
doc = "Minix v3 superblock at offset 1024"
size = 32
endian = "le"
fields = [
  { name = "ninodes",       offset = 0x00, type = "u32" },
  { name = "pad0",          offset = 0x04, type = "u16" },
  { name = "imap_blocks",   offset = 0x06, type = "u16" },
  { name = "zmap_blocks",   offset = 0x08, type = "u16" },
  { name = "firstdatazone", offset = 0x0A, type = "u16" },
  { name = "log_zone_size", offset = 0x0C, type = "u16" },
  { name = "pad1",          offset = 0x0E, type = "u16" },
  { name = "max_size",      offset = 0x10, type = "u32" },
  { name = "zones",         offset = 0x14, type = "u32" },
  { name = "magic",         offset = 0x18, type = "u16", expect = 0x4D5A },
  { name = "pad2",          offset = 0x1A, type = "u16" },
  { name = "blocksize",     offset = 0x1C, type = "u16" },
  { name = "disk_version",  offset = 0x1E, type = "u8" },
]

[erofs_superblock]
doc = "EROFS superblock at offset 1024"
size = 128
endian = "le"
fields = [
  { name = "magic",            offset = 0x00, type = "u32", expect = 0xE0F5E1E2 },
  { name = "checksum",         offset = 0x04, type = "crc32" },
  { name = "feature_compat",   offset = 0x08, type = "bits32", bits = { "0" = "sb_chksum", "1" = "mtime", "2" = "xattr_filter" } },
  { name = "blkszbits",        offset = 0x0C, type = "u8", doc = "Block size = 1 << blkszbits" },
  { name = "sb_extslots",      offset = 0x0D, type = "u8" },
  { name = "root_nid",         offset = 0x0E, type = "u16" },
  { name = "inos",             offset = 0x10, type = "u64" },
  { name = "build_time",       offset = 0x18, type = "u64" },
  { name = "build_time_nsec",  offset = 0x20, type = "u32" },
  { name = "blocks",           offset = 0x24, type = "u32" },
  { name = "meta_blkaddr",     offset = 0x28, type = "u32" },
  { name = "xattr_blkaddr",    offset = 0x2C, type = "u32" },
  { name = "uuid",             offset = 0x30, type = "uuid" },
  { name = "volume_name",      offset = 0x40, type = "ascii", size = 16 },
  { name = "feature_incompat", offset = 0x50, type = "bits32", bits = { "0" = "zero_padding", "1" = "compr_cfgs", "2" = "big_pcluster", "3" = "chunked_file", "4" = "device_table", "5" = "ztailpacking", "6" = "fragments", "7" = "dedupe", "8" = "xattr_prefixes" } },
  { name = "available_compr_algs", offset = 0x54, type = "u16" },
  { name = "extra_devices",    offset = 0x56, type = "u16" },
  { name = "devt_slotoff",     offset = 0x58, type = "u16" },
  { name = "dirblkbits",       offset = 0x5A, type = "u8" },
  { name = "xattr_prefix_count", offset = 0x5B, type = "u8" },
  { name = "xattr_prefix_start", offset = 0x5C, type = "u32" },
  { name = "packed_nid",       offset = 0x60, type = "u64" },
  { name = "xattr_filter_reserved", offset = 0x68, type = "u8" },
  { name = "reserved2",        offset = 0x69, type = "bytes", size = 23 },
]

[squashfs_superblock]
doc = "SquashFS 4 superblock at offset 0"
size = 96
endian = "le"
fields = [
  { name = "magic",             offset = 0x00, type = "ascii", size = 4, expect = "hsqs" },
  { name = "inode_count",       offset = 0x04, type = "u32" },
  { name = "mod_time",          offset = 0x08, type = "u32" },
  { name = "block_size",        offset = 0x0C, type = "u32" },
  { name = "frag_count",        offset = 0x10, type = "u32" },
  { name = "compressor",        offset = 0x14, type = "u16", enum = { "1" = "gzip", "2" = "lzma", "3" = "lzo", "4" = "xz", "5" = "lz4", "6" = "zstd" } },
  { name = "block_log",         offset = 0x16, type = "u16" },
  { name = "flags",             offset = 0x18, type = "u16" },
  { name = "id_count",          offset = 0x1A, type = "u16" },
  { name = "version_major",     offset = 0x1C, type = "u16", expect = 4 },
  { name = "version_minor",     offset = 0x1E, type = "u16" },
  { name = "root_inode",        offset = 0x20, type = "u64" },
  { name = "bytes_used",        offset = 0x28, type = "u64", doc = "Image size" },
  { name = "id_table_start",    offset = 0x30, type = "u64" },
  { name = "xattr_table_start", offset = 0x38, type = "u64" },
  { name = "inode_table_start", offset = 0x40, type = "u64" },
  { name = "dir_table_start",   offset = 0x48, type = "u64" },
  { name = "frag_table_start",  offset = 0x50, type = "u64" },
  { name = "lookup_table_start",offset = 0x58, type = "u64" },
]

[ocfs2_superblock]
doc = "OCFS2 superblock (dinode header skipped; fields from the inode's fs-specific union), little-endian"
size = 0xA0
endian = "le"
fields = [
  { name = "signature",      offset = 0x00, type = "ascii", size = 8, expect = "OCFSV2" },
  { name = "suballoc_slot",  offset = 0x08, type = "u16" },
  { name = "suballoc_bit",   offset = 0x0A, type = "u16" },
  { name = "links_count",    offset = 0x0C, type = "u32" },
  { name = "uid",            offset = 0x10, type = "u32" },
  { name = "gid",            offset = 0x14, type = "u32" },
  { name = "size",           offset = 0x18, type = "u64" },
  { name = "pad",            offset = 0x20, type = "bytes", size = 128 },
]
[ocfs2_super_block_info]
doc = "struct ocfs2_super_block (at dinode offset 0xC0)"
size = 0xA0
endian = "le"
fields = [
  { name = "major_rev_level",  offset = 0x00, type = "u16" },
  { name = "minor_rev_level",  offset = 0x02, type = "u16" },
  { name = "mnt_count",        offset = 0x04, type = "u16" },
  { name = "max_mnt_count",    offset = 0x06, type = "i16" },
  { name = "state",            offset = 0x08, type = "u16" },
  { name = "errors",           offset = 0x0A, type = "u16" },
  { name = "checkinterval",    offset = 0x0C, type = "u32" },
  { name = "lastcheck",        offset = 0x10, type = "u64" },
  { name = "creator_os",       offset = 0x18, type = "u32" },
  { name = "feature_compat",   offset = 0x1C, type = "u32" },
  { name = "feature_incompat", offset = 0x20, type = "u32" },
  { name = "feature_ro_compat",offset = 0x24, type = "u32" },
  { name = "root_blkno",       offset = 0x28, type = "u64" },
  { name = "system_dir_blkno", offset = 0x30, type = "u64" },
  { name = "blocksize_bits",   offset = 0x38, type = "u32" },
  { name = "clustersize_bits", offset = 0x3C, type = "u32" },
  { name = "max_slots",        offset = 0x40, type = "u16" },
  { name = "tunefs_flag",      offset = 0x42, type = "u16" },
  { name = "uuid_hash",        offset = 0x44, type = "u32" },
  { name = "first_cluster_group", offset = 0x48, type = "u64" },
  { name = "label",            offset = 0x50, type = "ascii", size = 64 },
  { name = "uuid",             offset = 0x90, type = "uuid" },
]

[udf_anchor_descriptor]
doc = "UDF Anchor Volume Descriptor Pointer (ECMA-167 3/10.2) at sector 256"
size = 32
endian = "le"
fields = [
  { name = "tag_id",          offset = 0x00, type = "u16", expect = 2, doc = "2 = AVDP" },
  { name = "descriptor_version", offset = 0x02, type = "u16" },
  { name = "tag_checksum",    offset = 0x04, type = "u8" },
  { name = "reserved",        offset = 0x05, type = "u8" },
  { name = "tag_serial",      offset = 0x06, type = "u16" },
  { name = "descriptor_crc",  offset = 0x08, type = "u16" },
  { name = "descriptor_crc_length", offset = 0x0A, type = "u16" },
  { name = "tag_location",    offset = 0x0C, type = "u32" },
  { name = "main_vds_length", offset = 0x10, type = "u32", doc = "Main volume descriptor sequence extent length" },
  { name = "main_vds_location", offset = 0x14, type = "u32" },
  { name = "reserve_vds_length", offset = 0x18, type = "u32" },
  { name = "reserve_vds_location", offset = 0x1C, type = "u32" },
]

[apfs_nx_superblock]
doc = "APFS container superblock (nx_superblock_t) at offset 0 (block 0)"
size = 0x100
endian = "le"
fields = [
  { name = "o_cksum",        offset = 0x00, type = "u64", doc = "Fletcher64 of the object (bytes 8..block size)" },
  { name = "o_oid",          offset = 0x08, type = "u64" },
  { name = "o_xid",          offset = 0x10, type = "u64" },
  { name = "o_type",         offset = 0x18, type = "u32", doc = "Low 16 bits: 1 = NX_SUPERBLOCK" },
  { name = "o_subtype",      offset = 0x1C, type = "u32" },
  { name = "nx_magic",       offset = 0x20, type = "ascii", size = 4, expect = "NXSB" },
  { name = "nx_block_size",  offset = 0x24, type = "u32", doc = "Usually 4096" },
  { name = "nx_block_count", offset = 0x28, type = "u64", nonzero = true },
  { name = "nx_features",    offset = 0x30, type = "u64" },
  { name = "nx_readonly_compatible_features", offset = 0x38, type = "u64" },
