  { name = "nx_xp_desc_next",   offset = 0x80, type = "u32" },
  { name = "nx_xp_data_next",   offset = 0x84, type = "u32" },
  { name = "nx_xp_desc_index",  offset = 0x88, type = "u32" },
  { name = "nx_xp_desc_len",    offset = 0x8C, type = "u32" },
  { name = "nx_xp_data_index",  offset = 0x90, type = "u32" },
  { name = "nx_xp_data_len",    offset = 0x94, type = "u32" },
  { name = "nx_spaceman_oid",   offset = 0x98, type = "u64" },
  { name = "nx_omap_oid",       offset = 0xA0, type = "u64" },
  { name = "nx_reaper_oid",     offset = 0xA8, type = "u64" },
  { name = "nx_test_type",      offset = 0xB0, type = "u32" },
  { name = "nx_max_file_systems", offset = 0xB4, type = "u32" },
  { name = "nx_fs_oid_first",   offset = 0xB8, type = "u64", doc = "First of 100 volume OIDs" },
]

