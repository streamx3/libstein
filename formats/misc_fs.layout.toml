  { name = "u64s",         offset = 0x7C, type = "u32" },
  { name = "time_base_lo", offset = 0x80, type = "u64" },
  { name = "time_base_hi", offset = 0x88, type = "u32" },
  { name = "time_precision", offset = 0x8C, type = "u32" },
  { name = "flags",        offset = 0x90, type = "bytes", size = 64 },
  { name = "features",     offset = 0xD0, type = "u64" },
]
