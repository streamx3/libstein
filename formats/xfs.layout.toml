# XFS on-disk superblock (xfs_format.h, struct xfs_dsb), big-endian, at offset 0 of each AG.
[xfs_superblock]
doc = "XFS superblock (AG 0 at offset 0; one per allocation group)"
size = 264
endian = "be"
fields = [
  { name = "magicnum",     offset = 0x00, type = "ascii", size = 4, expect = "XFSB" },
  { name = "blocksize",    offset = 0x04, type = "u32", nonzero = true, doc = "Filesystem block size in bytes" },
  { name = "dblocks",      offset = 0x08, type = "u64", nonzero = true, doc = "Data blocks" },
  { name = "rblocks",      offset = 0x10, type = "u64", doc = "Realtime blocks" },
  { name = "rextents",     offset = 0x18, type = "u64" },
  { name = "uuid",         offset = 0x20, type = "uuid" },
  { name = "logstart",     offset = 0x30, type = "u64", doc = "Start block of the internal log" },
  { name = "rootino",      offset = 0x38, type = "u64" },
  { name = "rbmino",       offset = 0x40, type = "u64" },
  { name = "rsumino",      offset = 0x48, type = "u64" },
  { name = "rextsize",     offset = 0x50, type = "u32" },
  { name = "agblocks",     offset = 0x54, type = "u32", nonzero = true, doc = "Blocks per allocation group" },
  { name = "agcount",      offset = 0x58, type = "u32", nonzero = true },
  { name = "rbmblocks",    offset = 0x5C, type = "u32" },
  { name = "logblocks",    offset = 0x60, type = "u32" },
  { name = "versionnum",   offset = 0x64, type = "bits16", bits = { "0" = "v1", "1" = "v2", "2" = "v3", "3" = "v4", "4" = "attr", "5" = "nlink", "6" = "quota", "7" = "align", "8" = "dalign", "9" = "shared", "10" = "logv2", "11" = "sector", "12" = "extflg", "13" = "dirv2", "14" = "borg", "15" = "morebits" }, doc = "Low 4 bits: version number (4 or 5)" },
  { name = "sectsize",     offset = 0x66, type = "u16", nonzero = true },
  { name = "inodesize",    offset = 0x68, type = "u16", nonzero = true },
  { name = "inopblock",    offset = 0x6A, type = "u16" },
  { name = "fname",        offset = 0x6C, type = "ascii", size = 12, doc = "Label" },
  { name = "blocklog",     offset = 0x78, type = "u8" },
  { name = "sectlog",      offset = 0x79, type = "u8" },
  { name = "inodelog",     offset = 0x7A, type = "u8" },
  { name = "inopblog",     offset = 0x7B, type = "u8" },
  { name = "agblklog",     offset = 0x7C, type = "u8" },
  { name = "rextslog",     offset = 0x7D, type = "u8" },
  { name = "inprogress",   offset = 0x7E, type = "u8", enum = { "0" = "complete", "1" = "mkfs in progress" } },
  { name = "imax_pct",     offset = 0x7F, type = "u8" },
  { name = "icount",       offset = 0x80, type = "u64", doc = "Allocated inodes" },
  { name = "ifree",        offset = 0x88, type = "u64" },
  { name = "fdblocks",     offset = 0x90, type = "u64", doc = "Free data blocks" },
  { name = "frextents",    offset = 0x98, type = "u64" },
  { name = "uquotino",     offset = 0xA0, type = "u64" },
  { name = "gquotino",     offset = 0xA8, type = "u64" },
  { name = "qflags",       offset = 0xB0, type = "u16" },
  { name = "flags",        offset = 0xB2, type = "u8" },
  { name = "shared_vn",    offset = 0xB3, type = "u8" },
  { name = "inoalignmt",   offset = 0xB4, type = "u32" },
  { name = "unit",         offset = 0xB8, type = "u32" },
  { name = "width",        offset = 0xBC, type = "u32" },
  { name = "dirblklog",    offset = 0xC0, type = "u8" },
  { name = "logsectlog",   offset = 0xC1, type = "u8" },
  { name = "logsectsize",  offset = 0xC2, type = "u16" },
  { name = "logsunit",     offset = 0xC4, type = "u32" },
  { name = "features2",    offset = 0xC8, type = "bits32", bits = { "1" = "lazysbcount", "3" = "attr2", "4" = "parent", "5" = "projid32", "7" = "crc", "8" = "ftype" } },
  { name = "bad_features2",offset = 0xCC, type = "u32" },
  { name = "features_compat",   offset = 0xD0, type = "u32", doc = "v5 only" },
  { name = "features_ro_compat",offset = 0xD4, type = "bits32", bits = { "0" = "finobt", "1" = "rmapbt", "2" = "reflink", "3" = "inobtcount" } },
  { name = "features_incompat", offset = 0xD8, type = "bits32", bits = { "0" = "ftype", "1" = "spinodes", "2" = "meta_uuid", "3" = "bigtime", "4" = "needsrepair", "5" = "nrext64", "6" = "exchrange", "7" = "parent" } },
  { name = "features_log_incompat", offset = 0xDC, type = "u32" },
  { name = "crc",          offset = 0xE0, type = "crc32", doc = "crc32c of the superblock sector (v5)" },
  { name = "spino_align",  offset = 0xE4, type = "u32" },
  { name = "pquotino",     offset = 0xE8, type = "u64" },
  { name = "lsn",          offset = 0xF0, type = "u64" },
  { name = "meta_uuid",    offset = 0xF8, type = "uuid", doc = "Used when meta_uuid feature is set" },
]
